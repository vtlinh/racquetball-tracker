<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#131b1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="2v2 Lineup" />
    <title>2v2 Lineup</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css?v=24" />
  </head>
  <body>
    <main>
      <header class="top">
        <div class="day-nav">
          <button class="btn" id="prevDay" title="Previous day with results" data-icon="left"></button>
          <div class="day-label" id="dayLabel">
            <span id="dayText"></span>
            <input type="date" id="dayPick" aria-label="Pick a day" />
          </div>
          <button class="btn" id="nextDay" title="Next day with results" data-icon="right"></button>
        </div>
        <nav class="actions" aria-label="Actions">
          <button class="btn" id="undoBtn" title="Undo last result change" data-icon="undo"></button>
          <button class="btn" id="redoBtn" title="Redo" data-icon="redo" hidden></button>
          <button class="btn" id="shuffleBtn" title="Reshuffle teams" data-icon="shuffle"></button>
          <button class="btn" id="settingsBtn" title="Settings" data-icon="settings"></button>
        </nav>
      </header>

      <section id="court" class="match"></section>
      <div id="outRow" class="out-row"></div>

      <section class="players" id="players" aria-label="Players"></section>

      <section class="stats-sec" aria-label="Stats">
        <div class="stats-bar">
          <div class="seg" id="statsSeg">
            <button class="btn text" data-scope="all" title="All time">All</button>
            <button class="btn text" data-scope="year">Year</button>
            <button class="btn text" data-scope="month">Month</button>
          </div>
          <div class="period">
            <button class="btn" id="prevPeriod" title="Previous" data-icon="left"></button>
            <span id="periodLabel"></span>
            <button class="btn" id="nextPeriod" title="Next" data-icon="right"></button>
          </div>
        </div>
        <div id="statsBody"></div>
        <p class="note" id="statsNote"></p>
        <div id="daysList" class="days"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>

    <dialog id="settingsDlg" class="sheet">
      <header class="sheet-head">
        <strong>Settings</strong>
        <button class="btn" data-close title="Close" data-icon="x"></button>
      </header>
      <h3>Players</h3>
      <div id="rosterList" class="roster"></div>
      <form id="addPlayerForm" class="row">
        <input id="newPlayer" placeholder="Add player" autocomplete="off" maxlength="20" />
        <button class="btn" title="Add" data-icon="plus"></button>
      </form>
      <h3>Scoring</h3>
      <ul class="scoring">
        <li>Singles and doubles: +1 for each winner, −1 for each loser.</li>
        <li>Triples: +1.5 for the winner, −1 for each of the other two.</li>
        <li>Sitting out does not change the score.</li>
        <li>The crown goes to the highest score and the poop to the lowest. A tie gets neither.</li>
      </ul>
    </dialog>

    <script>
      // When a new service worker takes over, reload so the page and its script stay in step.
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
      }
    </script>
    <script type="module" src="js/app.js?v=24"></script>
  </body>
</html>
